<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawstroids</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        canvas.fill {
            bottom: 0;
            right: 0;
        }
    </style>
</head>
<body>
    <canvas id="base" class="fill"></canvas>
    <canvas id="ship" class="fill"></canvas>
    <canvas id="stuff" class="fill"></canvas>
    <script src="index.js"></script>
</body>
</html>
